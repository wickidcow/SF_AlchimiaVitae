name: Build & Release AlchimiaVitae

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.5"
  OUTPUT_NAME: "SF_AlchimiaVitae1.0.5.jar"
  SLIMEFUN_LEGACY_VERSION: "4.1.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install pinned Apache Maven 3.10.2
        shell: bash
        run: |
          set -euo pipefail
          version=3.10.2
          archive="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          relative="maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
          curl -fsSL --retry 3 "https://downloads.apache.org/$relative" -o "$archive" || curl -fsSL --retry 3 "https://archive.apache.org/dist/$relative" -o "$archive"
          printf '%s  %s\n' '57d2db6b37e7582119137ade544557bba741b29e62109ef81539a2bdfd6d0e641fdd5d8edb014af1816d0510deac6fac8f347433b3a1aa36316ba85aa77b8119' "$archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          maven_bin="$RUNNER_TEMP/apache-maven-${version}/bin"
          "$maven_bin/mvn" --version | grep -F "Apache Maven ${version}"
          printf '%s\n' "$maven_bin" >> "$GITHUB_PATH"

      - name: Download Slimefun Legacy 4.1.80
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir legacy-deps
          test -s "legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"

      - name: Guard FLASH particle data and one-shot crafting output
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build Java 21 release baseline with Gradle
        run: chmod +x gradlew && ./gradlew clean build --no-daemon

      - name: Install Slimefun Legacy into local Maven repo
        run: >-
          mvn -B install:install-file
          -Dfile=legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar
          -DgroupId=com.github.wickidcow
          -DartifactId=Slimefun-Legacy
          -Dversion=${SLIMEFUN_LEGACY_VERSION}
          -Dpackaging=jar
          -DgeneratePom=true

      - name: Maven compile gate - Paper 1.21.11
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Maven compile gate - Paper 26.2 primary
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Maven compile gate - Paper 26.3 stable
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.3.build.249-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Rebuild universal release JAR from 1.21.11 Gradle baseline
        run: ./gradlew clean build --no-daemon

      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="build/libs/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.0.5'
          javap -verbose -classpath "$JAR" me.apeiros.alchimiavitae.AlchimiaVitae | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo 'Slimefun core classes must not be shaded into AlchimiaVitae.' >&2
            exit 1
          fi
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      # Publish new versions immediately after green master CI, but never overwrite
      # a prior tag/asset. The tag-triggered CI rerun is an idempotent no-op.
      - name: Publish a distinct immutable release from verified master
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${LEGACY_ARTIFACT_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG" || {
              echo "Refusing wrong-version tag." >&2
              exit 1
            }
          fi
          # Only a versioned, exact current protected master source can publish.
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$MASTER_SHA" && test "$GITHUB_SHA" = "$MASTER_SHA" || {
            echo "Refusing release: checkout is not current master." >&2
            exit 1
          }
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"
          EXPECTED_SHA256="$(sha256sum "$JAR" | cut -d' ' -f1)"
          # Future master changes with no version bump do not re-release old JARs.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release $TAG already exists; no duplicate publication."
            exit 0
          fi
          # An orphan tag on a normal master push is an error, not permission to
          # replace it with a different artifact.
          if [[ "$GITHUB_REF" == refs/heads/master ]] &&
             git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing already-existing release tag $TAG." >&2
            exit 1
          fi
          NOTES="AlchimiaVitae ${LEGACY_ARTIFACT_VERSION}: fixed Paper 26.3 FLASH particle data and once-only crafting completion; Java 21 universal JAR and Paper 1.21.11/26.2/26.3 compilation passed from current master $GITHUB_SHA. Backup and stage-test gameplay before production installation."
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA" --title "SF_AlchimiaVitae $TAG" --notes "$NOTES"
          mkdir -p "$RUNNER_TEMP/verify-published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern "$OUTPUT_NAME" --dir "$RUNNER_TEMP/verify-published"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/verify-published/$OUTPUT_NAME" | sha256sum -c -
