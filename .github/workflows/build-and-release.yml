name: Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify final JAR
        run: |
          JAR="build/libs/SF_AlchimiaVitae_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/SF_AlchimiaVitae_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Assets & Tags
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: release_info
        run: |
          mkdir -p release_assets
          JAR_FILE="build/libs/SF_AlchimiaVitae_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="AlchimiaVitae Legacy ${TAG}"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}-b${{ github.run_number }}"
            TITLE="AlchimiaVitae Legacy v${LEGACY_ARTIFACT_VERSION} (Build #${{ github.run_number }})"
          fi

          cp "$JAR_FILE" "release_assets/SF_AlchimiaVitae_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: release_assets/SF_AlchimiaVitae_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
