name: Build & Release AlchimiaVitae

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.4"
  OUTPUT_NAME: "SF_AlchimiaVitae1.0.4.jar"
  SLIMEFUN_LEGACY_VERSION: "4.1.46"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Download Slimefun Legacy 4.1.46
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir legacy-deps
          test -s "legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"

      - name: Build Java 21 release baseline with Gradle
        run: chmod +x gradlew && ./gradlew clean build --no-daemon

      - name: Install Slimefun Legacy into local Maven repo
        run: >-
          mvn -B install:install-file
          -Dfile=legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar
          -DgroupId=com.github.wickidcow
          -DartifactId=Slimefun-Legacy
          -Dversion=${SLIMEFUN_LEGACY_VERSION}
          -Dpackaging=jar
          -DgeneratePom=true

      - name: Maven compile gate - Paper 1.21.11
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Maven compile gate - Paper 26.2 primary
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Maven compile gate - Paper 26.3 stable
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.3.build.249-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Rebuild universal release JAR from 1.21.11 Gradle baseline
        run: ./gradlew clean build --no-daemon

      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="build/libs/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.0.4'
          javap -verbose -classpath "$JAR" me.apeiros.alchimiavitae.AlchimiaVitae | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo 'Slimefun core classes must not be shaded into AlchimiaVitae.' >&2
            exit 1
          fi
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      # Publishing is deliberately tag-only. Routine fixes merged to master must not
      # overwrite the immutable v1.0.4 asset or create a release implicitly.
      - name: Publish only a new immutable tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test "${TAG}" = "v${LEGACY_ARTIFACT_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "${JAR}"
          # Never --clobber a previous release asset, even on a rerun.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing published release ${TAG}" >&2
            exit 1
          fi
          NOTES="AlchimiaVitae ${LEGACY_ARTIFACT_VERSION}: Java 21 baseline, tested Paper compatibility; details in source changelog."
          gh release create "${TAG}" "${JAR}" \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --notes "${NOTES}" --title "SF_AlchimiaVitae ${TAG}"
