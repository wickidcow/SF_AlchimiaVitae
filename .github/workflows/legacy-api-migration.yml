name: One-time Slimefun Legacy API migration

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore classic Slimefun ItemStack API usage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          changed = 0
          for path in Path('src/main/java').rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('.item()', '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          gradle = Path('build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('version = "1.0.0"', 'version = "1.0.1"')
          text = text.replace(
              'compileOnly("maven.modrinth:slimefuncore:PEuZoZh4")',
              'compileOnly("com.github.SlimefunGuguProject:Slimefun4:2025.1")'
          )
          gradle.write_text(text, encoding='utf-8')

          print(f'Updated {changed} Java source files for classic SlimefunItemStack compatibility')
          PY

      - name: Commit migrated sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java build.gradle.kts
          if git diff --cached --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git commit -m "fix: restore Slimefun Legacy ItemStack API compatibility"
          git push origin HEAD:master
